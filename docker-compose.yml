services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mauru_practice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - mauru_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mauru_practice"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  mauru_postgres:
